[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure MeasureClash "Update"][!UpdateMeasure MeasureClash]

[Variables]
NextMode=direct
AlternateMode=direct
H=20
R=3
Icon=11
IconX=5
IconY=4
Font=8
FontFace=Verdana
FontWeight=400
LabelX=22
LabelY=3
ShadowY=4
Pad=8
Gap=16
Seam=5
SeamW=3
@Include=Badge.inc

[MeasureToggle]
Measure=Plugin
Plugin=RunCommand
Program=#@#ClashBadgeControl.exe
Parameter=#NextMode#
State=Hide
DynamicVariables=1
OutputType=UTF8
Timeout=5000
FinishAction=[!CommandMeasure MeasureClick "PatchFinished()"]

[MeasureClick]
Measure=Script
ScriptFile=#@#Click.lua

[MeterModeClick]
Meter=Image
SolidColor=0,0,0,0
X=([MeterLabel:X]+[MeterLabel:W]+#Pad#)
Y=0
W=(#Gap#+[MeterModeGauge:W])
H=#H#
DynamicVariables=1
MouseActionCursor=1
LeftMouseDownAction=[!CommandMeasure MeasureClick "Press($MouseX$,$MouseY$)"]
LeftMouseUpAction=[!CommandMeasure MeasureClick "Release($MouseX$,$MouseY$)"]
LeftMouseDoubleClickAction=[!CommandMeasure MeasureClick "Press($MouseX$,$MouseY$)"]
MouseLeaveAction=[!CommandMeasure MeasureClick "Cancel()"]
